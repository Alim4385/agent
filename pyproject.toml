[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-agent"
version = "1.0.0"
description = "Axtarışla gücləndirilmiş yerli LLM agenti"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckduckgo-search>=6.1",
    "trafilatura>=1.8",
    "lxml_html_clean>=0.1",
    "scikit-learn>=1.3",
]

[project.scripts]
web-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
