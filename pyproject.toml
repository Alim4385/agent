[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-agent"
version = "2.0.0"
description = "Axtarışla gücləndirilmiş yerli LLM agenti — sıfır xarici asılılıq (yalnız stdlib)"
requires-python = ">=3.10"
dependencies = []          # xarici paket yoxdur: hər şey Python standart kitabxanası ilə

[project.scripts]
web-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
